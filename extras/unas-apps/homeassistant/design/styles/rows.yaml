# uix style. Notices as rows in markdown: a dot in the colour of the level (<font color>),
# title bold (<b>), kind and detail grey (<small>). Every row is a card of its own.
style:
  .: |
    :host ha-card.text-only ha-markdown { padding: 0; }
  ha-markdown $: |
    ha-markdown-element > div {
      display: flex;
      align-items: center;
      gap: 12px;
      margin: 0 0 8px;
      padding: 12px 16px;
      border-radius: 18px;
      background: var(--zh-kachel-bg, rgba(28, 28, 31, 0.88));
      -webkit-backdrop-filter: var(--zh-unschaerfe, blur(24px));
      backdrop-filter: var(--zh-unschaerfe, blur(24px));
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif;
    }
    ha-markdown-element > div > font {
      flex: none;
      width: 10px;
      height: 10px;
      border-radius: 5px;
      background: currentColor;
      font-size: 0;
    }
    ha-markdown-element > div > span { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
    ha-markdown-element > div b { font-size: 15px; font-weight: 600; line-height: 1.3; color: #F2F2F7; }
    ha-markdown-element > div small { font-size: 13px; line-height: 1.35; color: #A1A1AA; }
    ha-markdown-element > p {
      margin: 2px 4px 0;
      font-size: 13px;
      color: color-mix(in srgb, var(--primary-text-color) 88%, transparent);
      text-shadow: 0 1px 2px rgba(0, 0, 0, 0.5), 0 0 8px rgba(0, 0, 0, 0.35);
    }
