# uix style. The grid card around the scenes: a dark field with a narrow edge, like a
# segmented control.
style: |
  :host {
    --grid-card-gap: 2px;
  }
  #root {
    padding: 3px;
    border-radius: 13px;
    background: rgba(44, 44, 48, 0.88);
    -webkit-backdrop-filter: blur(24px);
    backdrop-filter: blur(24px);
  }
