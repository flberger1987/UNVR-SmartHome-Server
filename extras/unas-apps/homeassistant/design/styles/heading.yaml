# uix style. Heading cards: section headings small, muted, upper case, spaced; page titles
# large and bold. The light shadow keeps the text readable on a background image.
style: |
  ha-card { --ha-font-family-body: -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif; }
  :host .container .content.subtitle,
  :host .container .content.subtitle h3 {
    font-family: var(--ha-font-family-body);
    font-size: 13px;
    font-weight: 600;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: color-mix(in srgb, var(--primary-text-color) 88%, transparent);
    text-shadow: 0 1px 2px rgba(0, 0, 0, 0.5), 0 0 8px rgba(0, 0, 0, 0.35);
  }
  :host .container .content.title,
  :host .container .content.title h3 {
    font-family: var(--ha-font-family-body);
    font-size: 28px;
    font-weight: 700;
    letter-spacing: -0.02em;
    color: var(--primary-text-color);
    text-shadow: 0 1px 2px rgba(0, 0, 0, 0.4), 0 0 10px rgba(0, 0, 0, 0.25);
  }
