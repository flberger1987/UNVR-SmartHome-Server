# uix style. Text without a frame (markdown with text_only): muted, with a light shadow for
# a background image.
style:
  ha-markdown $: |
    ha-markdown-element {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif;
      font-size: 14px;
      line-height: 1.45;
      color: color-mix(in srgb, var(--primary-text-color) 88%, transparent);
      text-shadow: 0 1px 2px rgba(0, 0, 0, 0.5), 0 0 8px rgba(0, 0, 0, 0.35);
    }
