# uix style. Area cards (compact): as "tile". When a light in the area is on, the card turns
# light as in Apple Home. The check is a Home Assistant template (config.area is the
# card's area).
style: |
  ha-card {
    --ha-card-background: rgba(28, 28, 31, 0.88);
    --ha-card-border-radius: 18px;
    --ha-card-border-width: 0;
    --ha-card-box-shadow: none;
    --ha-font-family-body: -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif;
    --ha-tile-info-primary-font-size: 15px;
    --ha-tile-info-primary-font-weight: 600;
    --ha-tile-info-secondary-font-size: 13px;
    --ha-tile-info-secondary-color: #A1A1AA;
    -webkit-backdrop-filter: blur(24px);
    backdrop-filter: blur(24px);
  }
  ha-card ha-tile-icon {
    --tile-icon-color: #E4E4E7;
    --tile-icon-opacity: 0.12;
    --tile-icon-hover-opacity: 0.2;
  }
  {% if area_entities(config.area) | select('match', 'light[.]') | select('is_state', 'on') | list | count > 0 %}
  ha-card {
    --ha-card-background: #F2F2F7;
    --primary-text-color: #111113;
    --secondary-text-color: #3F3F46;
    --ha-tile-info-primary-color: #111113;
    --ha-tile-info-secondary-color: #3F3F46;
  }
  ha-card ha-tile-icon {
    --tile-icon-color: #C77700;
    --tile-icon-opacity: 0.16;
    --tile-icon-hover-opacity: 0.24;
  }
  {% endif %}
